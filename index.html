<body>
    <div id="boot-loader" aria-hidden="true">
      <div class="boot-inner">
        <div class="boot-logo">MFA</div>
        <p class="boot-name">Muhammad Ferasat Ali</p>
        <div class="boot-bar"><span></span></div>
      </div>
    </div>
    <style>
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 100000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #080d1a;
        transition: opacity 0.35s ease;
      }
      #boot-loader.is-done {
        opacity: 0;
        pointer-events: none;
      }
      #boot-loader .boot-inner { text-align: center; width: min(320px, 80vw); }
      #boot-loader .boot-logo {
        font-family: system-ui, sans-serif;
        font-size: 3rem;
        font-weight: 800;
        letter-spacing: -0.03em;
        background: linear-gradient(90deg, #3b82f6, #06b6d4);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        margin-bottom: 0.5rem;
      }
      #boot-loader .boot-name {
        font-size: 0.8rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #94a3b8;
        margin: 0 0 1.75rem;
        font-family: system-ui, sans-serif;
      }
      #boot-loader .boot-bar {
        height: 2px;
        background: rgba(255,255,255,0.12);
        border-radius: 2px;
        overflow: hidden;
      }
      #boot-loader .boot-bar span {
        display: block;
        height: 100%;
        width: 35%;
        background: linear-gradient(90deg, #3b82f6, #06b6d4);
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(320%); }
      }
    </style>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
